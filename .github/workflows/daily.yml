
name: Update TAIFEX TXO Data

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一至週五 18:30、20:30、22:30
    - cron: '30 10,12,14 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official TAIFEX data
        run: python scripts/update_data.py

      - name: Analyze and evaluate forecasts
        run: python scripts/analyze.py

      - name: Save updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json docs/analysis.json docs/forecasts.json docs/evaluations.json docs/history/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update analysis and forecasts'
            git push
          fi
