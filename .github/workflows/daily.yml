name: Update TAIFEX TXO Data
on:
  workflow_dispatch:
  schedule:
    # 18:30, 20:30, 22:30 Taiwan time on weekdays (UTC 10:30,12:30,14:30)
    - cron: '30 10,12,14 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate official data
        run: python scripts/update_data.py
      - name: Commit new snapshot only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update TAIFEX options snapshot'
            git push
          fi
