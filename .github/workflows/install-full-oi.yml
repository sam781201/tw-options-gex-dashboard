name: Install v12 full strike OI chart
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inject full OI chart without replacing v11
        run: python scripts/insert_full_oi.py
      - name: Commit updated homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add full strike range OI map below near-term levels'
            git push
          fi
